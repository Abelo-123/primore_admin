<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Completed</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: #0a0a12;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            font-family: sans-serif;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div style="text-align: center;">
        <div class="spinner" style="margin: 0 auto 16px;"></div>
        <p style="font-size: 14px; opacity: 0.8;">Payment complete, returning to Telegram...</p>
    </div>

    <script>
        // Phase 2: Close-Popup Execution
        function handleClose() {
            // Environment Verification & Auto-Ready
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.ready();
                    // Closing the WebView
                    window.Telegram.WebApp.close();
                }
            } catch (e) {}

            try {
                window.close();
            } catch (e) {}

            // App Refocus Fallback after 200ms
            setTimeout(function() {
                const urlParams = new URLSearchParams(window.location.search);
                const botUsername = urlParams.get('bot') || 'adminprimora444';
                try {
                    window.location.replace("tg://resolve?domain=" + botUsername + "&startapp=open");
                } catch (e) {
                    window.location.replace("https://t.me/" + botUsername + "?startapp=open");
                }
            }, 200);
        }

        // Run immediately on page load
        handleClose();
    </script>
</body>
</html>
