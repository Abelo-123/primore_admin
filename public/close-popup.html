<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Completed</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background: #0a0a12;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 24px;
            box-sizing: border-box;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(99, 102, 241, 0.15);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
            transition: opacity 0.2s;
            margin-top: 20px;
        }
        .btn:active {
            opacity: 0.9;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h3 style="margin: 0 0 10px; font-size: 20px; font-weight: 700;">Payment Successful!</h3>
        <p style="font-size: 14px; opacity: 0.7; line-height: 1.5; margin: 0;">
            Returning to Telegram... If your browser doesn't return automatically, please click the button below:
        </p>
        <button onclick="handleManualRedirect()" class="btn">
            💬 Return to Telegram Bot
        </button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const botUsername = urlParams.get('bot') || 'adminprimora444';

        function getDeepLink() {
            return "tg://resolve?domain=" + botUsername + "&startapp=open";
        }
        function getWebLink() {
            return "https://t.me/" + botUsername + "?startapp=open";
        }

        function handleClose() {
            // 1. Try closing native Telegram WebApp browser overlay sheet
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.ready();
                    window.Telegram.WebApp.close();
                }
            } catch (e) {}

            // 2. Try standard window.close
            try {
                window.close();
            } catch (e) {}

            // 3. Fallback: try auto-redirecting
            try {
                window.location.replace(getDeepLink());
            } catch (e) {
                window.location.replace(getWebLink());
            }
        }

        function handleManualRedirect() {
            // Triggered by user click (always allowed by browsers)
            try {
                window.location.href = getDeepLink();
            } catch (e) {
                window.location.href = getWebLink();
            }
        }

        // Run auto-close attempts immediately
        handleClose();

        // Also schedule a secondary fallback to t.me URL if we remain stuck
        setTimeout(function() {
            try {
                window.location.replace(getWebLink());
            } catch(e) {}
        }, 1500);
    </script>
</body>
</html>
